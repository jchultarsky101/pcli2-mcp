[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.3"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Keep release.yml hand-patched without cargo-dist refusing it as "out of date".
# GitHub now redacts the large `val` manifest job output ("Skip output 'val' since it
# may contain secret"), which empties the build matrix and ships a release with no
# binaries. release.yml transports the matrix via a small credential-free output instead
# of `val`; `allow-dirty = ["ci"]` is the documented escape hatch that stops dist from
# treating that hand-edit as a fatal CI drift.
allow-dirty = ["ci"]
